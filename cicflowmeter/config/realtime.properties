# IMPORTANTE: l'ORDINE CONTA, nel senso che si possono scambiare a piacere, m al'ordine usato è quello con cui verrano mostrate in console o inviate su socket

# eventuali errori nei nomi o feattures inesistenti verrano ignorati e producono un messaggio di errore su stderr


# FLOW TIMEOUTS
flow.timeoutSeconds=120
flow.activityTimeoutSeconds=5
# NB: il primo serve a terminare i flussi (valori tipici 600, 120 sec)
# il secondo è per il calcolo active/idle statistics - NON è:
# - timeout della console
# - timeout socket
# - timeout dirty snapshot

# CONSOLE
console.enabled=true
console.topN=20
console.refreshSeconds=2



# qui sotto le features mostrate in console
console.features=flowId,srcIP,dstIP,srcPort,dstPort,protocol,flowDuration,totalFwdPackets,totalBackwardPackets,totalLengthOfFwdPackets,totalLengthOfBwdPackets,flowBytesPerSec,flowPacketsPerSec
#console.features=flowId,srcIP,dstIP,srcPort,dstPort,protocol


# SOCKET
socket.enabled=true
socket.port=9099
# NB: il traffico su questa porta viene filtrato
socket.snapshotSeconds=2

#Per avere solo snapshot e niente aggiornamenti immediati - atrimenti tutto true
# socket.sendUpdates=true
# socket.sendEnds=true
# socket.sendSnapshots=true
socket.sendUpdates=false
socket.sendEnds=false
socket.sendSnapshots=true


