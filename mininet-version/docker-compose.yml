services:

  mininet:
    build: ./mininet
    container_name: cic_mininet
    privileged: true
    network_mode: host
    volumes:
      - ./app:/app
      - ./pcap:/pcap
      - ./shared:/shared
    cap_add:
      - NET_ADMIN
      - SYS_MODULE

  cicflowmeter:
    build: ./cicflowmeter
    volumes:
      - ./pcap:/pcap
      - ./features:/features

  evaluator:
    build: ./evaluator
    volumes:
      - ./features:/features
      - ./results:/results

  optimizer:
    build: ./optimizer
    volumes:
      - ./shared:/shared
      - ./results:/results